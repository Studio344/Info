<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'"
    >
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="index, follow">
    <title>Dual Subtitles サポート - Studio344</title>
    <meta name="description" content="Dual Subtitlesの字幕が出ない、ずれるなどの不具合を報告する窓口です。">
    <link rel="canonical" href="https://studio344.github.io/Info/dual-subtitles-support.html">
    <link rel="icon" type="image/png" href="assets/logo-black.png">
    <style>
      :root {
        color-scheme: dark;
        --ink: #090d15;
        --panel: #142135;
        --panel-end: #0d1725;
        --edge: #304765;
        --text-primary: #f2f5fa;
        --text-secondary: #b9c8da;
        --accent-primary: #7dd2ff;
        --accent-ink: #06131d;
        --accent-secondary: #ffe36e;
        --radius-md: 12px;
        --radius-lg: 24px;
        --text-sm: 14px;
        --text-md: 16px;
        --focus: #a5b4fc;
        --font-main: "Hiragino Sans", "Yu Gothic Medium", "Noto Sans JP",
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(ellipse at 75% top, rgba(60, 128, 196, .22), transparent 59%),
          var(--ink);
        color: var(--text-primary);
        font: var(--text-md)/1.75 var(--font-main);
      }

      .wrap {
        width: min(46rem, calc(100% - 2rem));
        margin-inline: auto;
      }
      .skip-link {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 1;
        transform: translateY(calc(-100% - 2rem));
        padding: .5rem .9rem;
        border-radius: var(--radius-md);
        background: var(--accent-secondary);
        color: var(--accent-ink);
      }
      .skip-link:focus { transform: translateY(0); }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: .7rem;
        padding-block: 1.6rem;
        font-weight: 750;
      }
      .subtitle-mark {
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 4px;
        width: 40px;
        height: 40px;
        border: 1px solid var(--edge);
        border-radius: var(--radius-md);
        background: var(--panel-end);
      }
      .subtitle-mark::before,
      .subtitle-mark::after {
        content: "";
        height: 5px;
        border-radius: 4px;
      }
      .subtitle-mark::before {
        width: 25px;
        background: var(--text-primary);
      }
      .subtitle-mark::after {
        width: 16px;
        background: var(--accent-secondary);
      }

      .support-card {
        padding: clamp(1.25rem, 5vw, 3rem);
        border: 1px solid var(--edge);
        border-radius: var(--radius-lg);
        background: linear-gradient(145deg, var(--panel), var(--panel-end));
      }
      h1 {
        margin: 0 0 .65rem;
        font-size: clamp(1.65rem, 5vw, 2.4rem);
        line-height: 1.35;
        text-wrap: balance;
      }
      p {
        margin: 0;
        color: var(--text-secondary);
        line-break: strict;
      }
      .support-action {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .55rem;
        min-height: 48px;
        margin-block: 1.5rem 1rem;
        padding: .55rem 1.2rem;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        background: var(--accent-primary);
        color: var(--accent-ink);
        font-weight: 750;
        text-decoration: none;
      }
      .support-action:hover { background: var(--accent-secondary); }
      @media (min-width: 35rem) {
        .support-action { width: fit-content; }
      }
      @media (forced-colors: active) {
        .support-action { border-color: ButtonText; }
      }
      .support-note { font-size: var(--text-sm); }

      .support-footer {
        display: flex;
        flex-wrap: wrap;
        gap: .5rem 1.25rem;
        padding-block: 1.1rem 2rem;
      }
      .support-footer a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--accent-primary);
        font-size: var(--text-sm);
        text-underline-offset: .28em;
      }
    </style>
  </head>
  <body data-page="dual-subtitles-support">
    <a href="#main-content" class="skip-link">本文へ移動</a>
    <header class="brand wrap">
      <span class="subtitle-mark" aria-hidden="true"></span>
      <span>Dual Subtitles</span>
    </header>
    <main id="main-content" class="wrap">
      <section class="support-card" aria-labelledby="support-title">
        <h1 id="support-title">字幕の不具合を報告</h1>
        <p>起きたことを記入してください。作品名や再生位置は、分かる場合に添えられます。 Disney+ プレビューの作品名や再生位置は、分かる範囲でフォームに入力できます。</p>
        <a
          class="support-action"
          href="https://docs.google.com/forms/d/e/1FAIpQLSeaI9FFhlR-_phLTTTsvadWNcwhCWb-14keav1ntmDk6ZbVeQ/viewform"
          target="_blank"
          rel="noopener noreferrer"
        >Googleフォームを開く <span aria-hidden="true">↗</span></a>
        <p class="support-note">フォームは別タブで開きます。送信された内容は、Studio344が不具合の再現と改善に使用します。</p>
      </section>
    </main>
    <footer class="support-footer wrap">
      <a href="dual-subtitles-privacy.html">プライバシーポリシー</a>
      <a href="./">Studio344</a>
    </footer>
  </body>
</html>
